name: GitHub metrics

on:
  schedule:
    - cron: "0 0 * * *"   # daily
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          # GITHUB_TOKEN works for public data. For private-repo stats, add a PAT as secret METRICS_TOKEN
          # and change this to ${{ secrets.METRICS_TOKEN }}.
          token: ${{ secrets.GITHUB_TOKEN }}
          user: Sean-Hawks
          filename: github-metrics.svg
          committer_branch: output
          template: classic
          config_timezone: Asia/Taipei
          config_display: large
          base: header, activity, community, repositories, metadata
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_ignored: html, jupyter notebook
          plugin_languages_sections: most-used
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_habits: yes
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_habits_charts_type: classic
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: C
          plugin_stars: no
